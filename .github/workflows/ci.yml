name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --no-default-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      - run: cargo test --no-default-features --lib

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  fuzz:
    name: fuzz (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # rust-toolchain.toml pins stable; `+nightly` overrides it for cargo-fuzz.
      # The prebuilt cargo-fuzz defaults to the musl target it was built for,
      # and AddressSanitizer cannot link against static musl, so name the
      # glibc target explicitly.
      - name: Fuzz the lexer
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu lex -- -max_total_time=60 -dict=${{ github.workspace }}/fuzz/p21.dict
      - name: Fuzz the parser
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu parse -- -max_total_time=60 -dict=${{ github.workspace }}/fuzz/p21.dict
      # From an empty corpus, a minute of fuzzing does not write a file with
      # an instance in it, so no reader would run: start from the seeds. The
      # writable corpus comes first, or new inputs land among the seeds, and
      # libFuzzer creates it on a fresh checkout.
      - name: Fuzz the readers
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu read ${{ github.workspace }}/fuzz/corpus/read ${{ github.workspace }}/fuzz/seeds/read -- -create_missing_dirs=1 -max_total_time=60 -dict=${{ github.workspace }}/fuzz/p21.dict
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  occt:
    name: OCCT geometry check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # setup-uv publishes no moving major tag, so pin the release.
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Cache fixtures
        uses: actions/cache@v6
        with:
          path: tests/fixtures
          key: fixtures-${{ hashFiles('tools/fetch-fixtures.sh') }}
      # Only the small set: Open CASCADE needs minutes per Open Compute file
      # (tools/fetch-fixtures.sh ocp), which is too slow for every push.
      - run: tools/fetch-fixtures.sh core
      # Rewrites every fixture with renumbered instances and checks through
      # Open CASCADE that solids, volume, names and colours are unchanged.
      - run: tools/verify-rewrite.sh
      # Splits every fixture and checks that top-level outputs reproduce the
      # input and that each assembly equals its components.
      - run: tools/verify-split.py
      # Writes the files only Open CASCADE writes (never committed): the same
      # plate in millimetres, inches, feet, centimetres and metres, and a part
      # with every elementary surface, a cone point and a void in millimetres
      # and inches; and, under assemblies/, a nested assembly with a repeated
      # sub-assembly and arbitrary rotations, and two cases made from it that
      # ISO 10303 and Open CASCADE place differently.
      - run: tools/gen-occt-cases.py "$RUNNER_TEMP/occt-cases"
      # Reads every unit context through stepq and Open CASCADE and compares
      # their factors and uncertainties.
      - run: tools/verify-read.py units tests/fixtures "$RUNNER_TEMP/occt-cases"
      # Reads the surface of every face and the 3D curve of every edge of a
      # face through both, in mm and rad, and matches them one to one (the
      # cylinder axes and hole circles of M1's exit test), on the fixtures
      # and the generated parts. Open CASCADE's healing is excused rather than
      # matched, so its tallies (lines and circles that are seams, pieces of
      # split edges, other curves) are pinned for this set: an edge stepq
      # stops reading changes them. Re-pin them when the fixtures or the
      # generated parts change.
      - run: tools/verify-read.py surfaces tests/fixtures "$RUNNER_TEMP"/occt-cases/*.step
      - run: tools/verify-read.py curves --healing=5,267,770 tests/fixtures "$RUNNER_TEMP"/occt-cases/*.step
      # Places every occurrence under every root through both, in mm, and
      # matches them one to one by the names on their paths, or by value
      # where Open CASCADE leaves a component unnamed (M1's exit test, part
      # 1). The divergence cases must be refused. The counts of occurrences
      # matched and refused as divergent are pinned for this set, because an
      # occurrence stepq dropped that Open CASCADE leaves unnamed would
      # otherwise pass. Re-pin them when the fixtures or the generated cases
      # change.
      - run: tools/verify-read.py occurrences --expect=375,4 tests/fixtures "$RUNNER_TEMP/occt-cases"
      # The fixture tests with their pinned counts; a missing core fixture
      # fails them here instead of skipping.
      - run: cargo test --all-features --test units --test geometry --test placements --test fixtures
        env:
          STEPQ_REQUIRE_FIXTURES: "1"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
