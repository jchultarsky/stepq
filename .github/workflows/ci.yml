name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --no-default-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      - run: cargo test --no-default-features --lib

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  fuzz:
    name: fuzz (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # rust-toolchain.toml pins stable; `+nightly` overrides it for cargo-fuzz.
      # The prebuilt cargo-fuzz defaults to the musl target it was built for,
      # and AddressSanitizer cannot link against static musl, so name the
      # glibc target explicitly.
      - name: Fuzz the lexer
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu lex -- -max_total_time=60 -dict=${{ github.workspace }}/fuzz/p21.dict
      - name: Fuzz the parser
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu parse -- -max_total_time=60 -dict=${{ github.workspace }}/fuzz/p21.dict
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  occt:
    name: OCCT geometry check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # setup-uv publishes no moving major tag, so pin the release.
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Cache fixtures
        uses: actions/cache@v6
        with:
          path: tests/fixtures
          key: fixtures-${{ hashFiles('tools/fetch-fixtures.sh') }}
      # Only the small set: Open CASCADE needs minutes per Open Compute file
      # (tools/fetch-fixtures.sh ocp), which is too slow for every push.
      - run: tools/fetch-fixtures.sh core
      # Rewrites every fixture with renumbered instances and checks through
      # Open CASCADE that solids, volume, names and colours are unchanged.
      - run: tools/verify-rewrite.sh
      # Splits every fixture and checks that top-level outputs reproduce the
      # input and that each assembly equals its components.
      - run: tools/verify-split.py

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
