version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    # release.yml is generated by dist; `dist generate` updates its actions.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: monthly
