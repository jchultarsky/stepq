[package]
name = "stepq"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
description = "Query, inspect, split and reshape STEP (ISO 10303-21) files — a library and a CLI, no geometry kernel needed"
authors = ["Julian Chultarsky"]
license = "MIT"
repository = "https://github.com/jchultarsky/stepq"
homepage = "https://github.com/jchultarsky/stepq"
documentation = "https://docs.rs/stepq"
readme = "README.md"
keywords = ["step", "iso-10303", "cad", "bom", "parser"]
categories = ["parser-implementations", "command-line-utilities", "science"]
exclude = ["/.github", "/docs", "/fuzz", "/tests/fixtures", "/tools", "/CLAUDE.md", "/dist-workspace.toml"]

[lib]
name = "stepq"
path = "src/lib.rs"

# The CLI is compiled only with the `cli` feature (on by default so that
# `cargo install stepq` just works). Library users opt out with
# `default-features = false`.
[[bin]]
name = "stepq"
path = "src/bin/stepq.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow", "serde"]
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
thiserror = "2"

# cli
clap = { version = "4", features = ["derive", "wrap_help"], optional = true }
anyhow = { version = "1", optional = true }

# serde
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that dist builds release binaries with.
[profile.dist]
inherits = "release"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
